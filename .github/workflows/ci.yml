name: CI

on:
  pull_request:
    branches: [staging, main]
  push:
    branches: [staging, main]

jobs:
  calidad:
    name: Calidad (lint · typecheck · licencias · unit · build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Guardián de tokens de diseño (§7)
        run: npm run design:check
      - name: Guardián de licencias
        run: npm run licenses:check
      - name: Avisos de terceros al día
        run: npm run notices:check
      - name: Tests unitarios con cobertura (umbral §8.1)
        run: npm run test:unit:coverage
      - name: Build estático
        run: npm run build
      - name: Presupuesto de bundle
        # No bloqueante hasta el Hito 7. El baseline de 200 KB (Hito 0) queda
        # superado por el glue de códecs jSquash (~135 KB) que añade el Hito 3.
        # El presupuesto real del §8.6 (JS 130 KB / CSS 25 KB / fuentes 60 KB)
        # se activa como puerta en el Hito 7 vía `budget:check`, cuando la carga
        # diferida de códecs y el subconjunto latino de Inter estén en su sitio.
        continue-on-error: true
        run: npm run size

  e2e:
    name: E2E (${{ matrix.browser }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Instalar navegadores
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Playwright
        run: npm run test:e2e -- --project=${{ matrix.browser }}
      - name: Subir reporte
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.browser }}
          path: playwright-report/
          retention-days: 14

  produccion:
    name: Artefacto de producción (CSP · COOP/COEP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Instalar navegadores
        run: npx playwright install --with-deps chromium
      # Sirve `out/` con las cabeceras reales de `vercel.json`. El resto de la
      # matriz corre contra `next dev`, que no aplica ninguna: sin este job, un
      # fallo que rompa la CSP no se ve hasta que está desplegado.
      - name: Playwright contra el export estático
        run: npm run test:e2e:prod
      - name: Subir reporte
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-produccion
          path: playwright-report/
          retention-days: 14
