name: Lighthouse CI

on:
  pull_request:
    branches: [staging, main]
  push:
    branches: [staging, main]

jobs:
  lighthouse:
    name: Lighthouse (perfil móvil)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Build estático
        run: npm run build
      - name: Lighthouse CI
        run: npm run lhci
